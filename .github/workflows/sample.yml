# Template only. Do not enable until you have a private repo, secrets, and want collection to start.
name: Loop Watch sample

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run sample
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
