# Samples weekday rush-hour travel times and commits new CSV rows to this repo.
# The sampler itself gates each city in its local timezone; these cron expressions
# are the UTC envelope that covers standard and daylight time so no window is missed.
# Requires the repository secret TOMTOM_API_KEY. Actions must be enabled on the repo.
name: Loop Watch sample

on:
  schedule:
    # Morning rush, Mon–Fri UTC. Covers Orlando 7:00 a.m. ET (11:00 UTC in EDT,
    # 12:00 UTC in EST) through Las Vegas 9:30 a.m. PT (16:30 UTC in PDT,
    # 17:30 UTC in PST), plus a late slot for the sampler's 15-minute grace.
    - cron: "0,30 11-17 * * 1-5"
    # Evening rush start, Mon–Fri UTC. Covers Orlando 4:00 p.m. ET (20:00 UTC in
    # EDT, 21:00 UTC in EST) through 23:30 UTC.
    - cron: "0,30 20-23 * * 1-5"
    # Evening rush tail after midnight UTC (Las Vegas 3:30–6:30 p.m. PT crosses
    # 00:00 UTC). 00:00–02:30 UTC Tuesday–Saturday is Monday–Friday evening
    # in US timezones, including standard time (Vegas 6:30 p.m. PST = 02:30 UTC).
    - cron: "0,30 0-2 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loop-watch-sample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run sample
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
      - name: Commit travel samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new CSV rows to commit."
          else
            git commit -m "Add Loop Watch travel samples"
            git push
          fi
